name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: DoozyX/clang-format-lint-action@v0.15
      with:
        source: './app ./include ./src ./test'
  build-linux:
    strategy:
      matrix:
        include:
          - preset: debug
            build_dir: build/debug
            artifact_name: DEBUG
          - preset: release
            build_dir: build/release
            artifact_name: RELEASE
          - preset: ci-stats
            build_dir: build/ci-stats
            artifact_name: RELEASE-stats
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set binary paths
      id: set_binaries
      run: |
        echo "ACC_BINARY=${{ matrix.build_dir }}/bin/itlabai_acc" >> $GITHUB_OUTPUT
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}-${{ matrix.preset }}
        max-size: 2G
    - name: Build
      run: |
        cmake --preset ${{ matrix.preset }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build --preset ${{ matrix.preset }} --parallel
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
    - name: Package smoke test
      if: matrix.preset == 'release'
      run: |
        set -euo pipefail
        INSTALL_DIR="$(mktemp -d)"
        cmake --install "${{ matrix.build_dir }}" --prefix "$INSTALL_DIR"

        CONSUMER_DIR="$(mktemp -d)"
        cat > "$CONSUMER_DIR/CMakeLists.txt" <<'CMAKE'
        cmake_minimum_required(VERSION 3.20)
        project(itlabai_consumer LANGUAGES CXX)
        find_package(ITLabAI CONFIG REQUIRED)
        add_executable(consumer main.cpp)
        target_link_libraries(consumer PRIVATE ITLabAI::graph)
        set_target_properties(consumer PROPERTIES CXX_STANDARD 20 CXX_STANDARD_REQUIRED YES)
        CMAKE
        cat > "$CONSUMER_DIR/main.cpp" <<'CPP'
        #include <graph/graph.hpp>
        int main() { it_lab_ai::Graph g; (void)g; return 0; }
        CPP

        cmake -S "$CONSUMER_DIR" -B "$CONSUMER_DIR/build" -DCMAKE_PREFIX_PATH="$INSTALL_DIR" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$CONSUMER_DIR/build" --parallel
    - name: Prepare ALL libs
      run: |
       mkdir -p ${{ matrix.build_dir }}/bin/all_libs
       # Copy bundled runtime libs from ExternalProject installs (OpenCV/oneDNN/TBB).
       cp -a ${{ matrix.build_dir }}/_external/install/*/opencv_min/lib/* ${{ matrix.build_dir }}/bin/all_libs/ 2>/dev/null || true
       cp -a ${{ matrix.build_dir }}/_external/install/*/onednn/lib/* ${{ matrix.build_dir }}/bin/all_libs/ 2>/dev/null || true
       cp -a ${{ matrix.build_dir }}/_external/install/*/tbb/lib/* ${{ matrix.build_dir }}/bin/all_libs/ 2>/dev/null || true
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
       name: mnist-${{ matrix.artifact_name }}
       path: |
        ${{ steps.set_binaries.outputs.ACC_BINARY }}
        ${{ matrix.build_dir }}/bin/all_libs/*
    - name: Test
      run: ctest --preset ${{ matrix.preset }} --output-on-failure
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
    - name: Test (valgrind)
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind
        # Keep valgrind runtime bounded: run the unit subset (perf tests are still executed above).
        valgrind --error-exitcode=1 ${{ matrix.build_dir }}/bin/itlabai_run_test --gtest_filter=-convlayer_parall.*
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
  build-linux-clang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install prerequisites
      run: |
        sudo apt install clang libomp-dev
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}
    - name: Build
      run: |
        cmake --preset release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++
        cmake --build --preset release --parallel
    - name: Test
      run: ctest --preset release --output-on-failure
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
    - name: Test (valgrind)
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind
        valgrind --error-exitcode=1 build/release/bin/itlabai_run_test --gtest_filter=-convlayer_parall.*
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
  build-macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install prerequisites
      run: |
        brew install libomp ninja
        brew link libomp --overwrite --force
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}
    - name: Build
      run: |
        OPENMP_PATH=$(brew --prefix libomp)
        echo "OpenMP path: $OPENMP_PATH"
        cmake --preset release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_PREFIX_PATH=$OPENMP_PATH \
          -DCMAKE_INCLUDE_PATH=$OPENMP_PATH/include \
          -DCMAKE_LIBRARY_PATH=$OPENMP_PATH/lib \
          -DOpenMP_C_FLAGS="-Xclang -fopenmp -I$OPENMP_PATH/include" \
          -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I$OPENMP_PATH/include" \
          -DOpenMP_C_LIB_NAMES="omp" \
          -DOpenMP_CXX_LIB_NAMES="omp" \
          -DOpenMP_omp_LIBRARY="$OPENMP_PATH/lib/libomp.dylib" \
          -DCMAKE_EXE_LINKER_FLAGS="-L$OPENMP_PATH/lib -lomp" \
          -DCMAKE_SHARED_LINKER_FLAGS="-L$OPENMP_PATH/lib -lomp"
        cmake --build --preset release --parallel
      env:
        LDFLAGS: "-L$(brew --prefix libomp)/lib -lomp"
        CPPFLAGS: "-I$(brew --prefix libomp)/include"
    - name: Test
      run: ctest --preset release --output-on-failure
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
  build-windows:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: 'latest'
    - name: Setup ccache
      uses: Chocobo1/setup-ccache-action@v1
      with:
        windows_compile_environment: msvc
    - name: Setup ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
    - name: Setup MSVC for Ninja again
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build
      run: |
        cmake --preset release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build --preset release --parallel --config Release
    - name: Test
      run: ctest --preset release --output-on-failure
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install prerequisites
      run: sudo apt-get update && sudo apt-get install -y libomp-dev build-essential cmake
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}
    - name: Build and Test
      run: |
        cmake --preset release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build --preset release --parallel
        ctest --preset release --output-on-failure
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
  codecov:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gcovr
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}
        max-size: 2G
    - name: Build
      run: |
        cmake --preset coverage \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build --preset coverage --parallel
    - name: Test
      run: ctest --preset coverage --output-on-failure
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
    - name: Generate Coverage Data
      run: gcovr -r . --xml -o coverage.xml --gcov-ignore-parse-errors
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: embedded-dev-research/ITLabAI
        files: coverage.xml
        disable_search: true

  evaluate-model:
    runs-on: ubuntu-latest
    needs: [build-linux]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download binary and libs
      uses: actions/download-artifact@v4
      with:
        name: mnist-RELEASE
        path: build/
        
    - name: Set binary path
      id: set_eval_binary
      run: |
        EVAL_BINARY=$(find build -type f -name itlabai_acc | head -n1)
        if [ -z "$EVAL_BINARY" ]; then
          echo "Failed to locate itlabai_acc in downloaded artifact"
          exit 1
        fi
        echo "EVAL_BINARY=$EVAL_BINARY" >> $GITHUB_OUTPUT
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-0 libtbb12 libjpeg-dev libpng-dev libtiff-dev libopenjp2-7 libdnnl3
        sudo ldconfig
        
    - name: Generate model JSON
      run: |
        cd docs && mkdir -p jsons
        cd ..
        cd app/Converters
        pip install -r requirements.txt
        python parser.py
        cd ../..

    - name: Cache MNIST test dataset
      id: cache-mnist
      uses: actions/cache@v4
      with:
        path: docs/mnist/mnist/test
        key: mnist-dataset-e2d09c892023700f68bfa9f30ac91a4dffaa23b151deeaca627101b3d73ef83d

    - name: Download MNIST test dataset
      if: steps.cache-mnist.outputs.cache-hit != 'true'
      run: |
        mkdir -p docs/mnist/mnist/test
        wget -q https://github.com/DeepTrackAI/MNIST_dataset/archive/main.zip -O main.zip
        unzip -q main.zip
        cp MNIST_dataset-main/mnist/test/*.png docs/mnist/mnist/test/
        rm -rf main.zip MNIST_dataset-main

    - name: Prepare environment
      run: |
        chmod +x "${{ steps.set_eval_binary.outputs.EVAL_BINARY }}"
        export LD_LIBRARY_PATH=$PWD/build/release/bin/all_libs:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        
    - name: Run evaluation
      run: |
        export LD_LIBRARY_PATH=$PWD/build/release/bin/all_libs:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        "${{ steps.set_eval_binary.outputs.EVAL_BINARY }}" --model alexnet_mnist > accuracy.txt 2>&1
        if [ $? -ne 0 ]; then
          exit 1
        fi

    - name: Extract accuracy value
      run: |
        ACCURACY=$(grep -oE '[0-9]+\.?[0-9]*%' accuracy.txt | head -1 || echo "0%")
        echo "$ACCURACY" > accuracy_value.txt
        
    - name: Update README (master only)
      if: github.ref == 'refs/heads/master'
      run: |
        ACCURACY=$(cat accuracy_value.txt | sed 's/%//g')
        DATE=$(date '+%Y-%m-%d')
        sed -i "s/<!--ACCURACY_PLACEHOLDER-->.*<!--END_ACCURACY-->/<!--ACCURACY_PLACEHOLDER-->Accuracy: ${ACCURACY}% (updated: ${DATE})<!--END_ACCURACY-->/" README.md

    - name: Commit and push changes (master only)
      if: github.ref == 'refs/heads/master'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add README.md
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
        else
          git commit -m "[CI] Update accuracy: $(cat accuracy_value.txt)"
          git push origin master
        fi
